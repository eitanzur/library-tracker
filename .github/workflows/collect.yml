name: collect

# Snapshot library occupancy every 15 minutes and commit it to the `data` branch.
#
# GitHub's cron alone is unreliable (new repos can wait hours; busy-time runs get
# dropped), so each run loops for ~5.5 h, taking a snapshot every 15 min, then
# starts the next run itself (workflow_dispatch via the built-in token is allowed).
# The cron below is only a backup that restarts the chain if it ever breaks; the
# concurrency group keeps a single chain alive. Cancel a run by hand to stop it.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds to keep looping"
        default: "19800"
      interval:
        description: "Seconds between snapshots"
        default: "900"
      chain:
        description: "Start the next run when done"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          path: src

      - uses: actions/checkout@v5
        with:
          ref: data
          path: store

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Snapshot every 15 minutes
        env:
          DURATION: ${{ inputs.duration || '19800' }}
          INTERVAL: ${{ inputs.interval || '900' }}
        run: bash src/collector/loop.sh

      - name: Start the next run
        if: (success() || failure()) && (github.event_name == 'schedule' || inputs.chain)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --repo "${{ github.repository }}" --ref main
