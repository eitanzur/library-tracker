name: collect

# Snapshot library occupancy every 15 minutes and commit it to the `data` branch.
# Off-peak minutes on purpose: GitHub delays/drops many scheduled runs at :00/:15/:30/:45.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: src

      - uses: actions/checkout@v5
        with:
          ref: data
          path: store

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect snapshot
        run: python src/collector/collect.py store

      - name: Commit data
        working-directory: store
        run: |
          git config user.name "library-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin data && git push -q origin data && exit 0; sleep 5; done
          exit 1
